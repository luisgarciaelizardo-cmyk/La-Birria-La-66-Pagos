<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f97316">
  <title>Pagos · La Birria La 66</title>
  <style>
    :root {
      --orange: #f97316;
      --orange-dark: #c2410c;
      --orange-soft: #fff7ed;
      --orange-line: #fed7aa;
      --text: #1f2937;
      --muted: #6b7280;
      --green: #25d366;
      --green-dark: #1da851;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      background: linear-gradient(160deg, #fdba74 0%, var(--orange) 45%, var(--orange-dark) 100%);
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(124, 45, 18, 0.35);
      overflow: hidden;
    }

    .card-header {
      background: var(--orange);
      color: #fff;
      text-align: center;
      padding: 24px 20px 20px;
    }

    .card-header .brand {
      font-size: 0.9rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.9;
    }

    .card-header h1 {
      margin-top: 4px;
      font-size: 1.9rem;
      letter-spacing: 0.04em;
    }

    .card-body { padding: 24px 20px 28px; }

    .label {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--orange-dark);
      margin-bottom: 6px;
    }

    .number {
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-align: center;
      padding: 14px 10px;
      background: var(--orange-soft);
      border: 2px dashed var(--orange-line);
      border-radius: 12px;
      word-break: break-all;
    }

    .holder {
      margin-top: 18px;
      font-size: 1.05rem;
      font-weight: 600;
    }

    .note {
      margin-top: 22px;
      padding: 12px 14px;
      border-left: 4px solid var(--orange);
      background: var(--orange-soft);
      border-radius: 8px;
      font-size: 0.95rem;
    }

    .note strong { color: var(--orange-dark); }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 15px 18px;
      border: none;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 700;
      font-family: inherit;
      color: #fff;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.1s, background 0.2s;
    }

    .btn:active { transform: scale(0.98); }
    .btn svg { width: 22px; height: 22px; flex-shrink: 0; }

    .btn-copy { margin-top: 12px; background: var(--orange); }
    .btn-copy:hover { background: var(--orange-dark); }
    .btn-copy.copied { background: #16a34a; }

    .btn-whatsapp { margin-top: 12px; background: var(--green); }
    .btn-whatsapp:hover { background: var(--green-dark); }

    .phone {
      margin-top: 8px;
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
    }

    footer {
      text-align: center;
      padding: 14px;
      font-size: 0.8rem;
      color: var(--muted);
      border-top: 1px solid #f3f4f6;
    }
  </style>
</head>
<body>
  <main class="card">
    <header class="card-header">
      <div class="brand">La Birria La 66</div>
      <h1>TRANSFERENCIAS</h1>
    </header>

    <section class="card-body">
      <div class="label">Número de cuenta</div>
      <div class="number" id="account">5579 0701 6890 9375</div>

      <button class="btn btn-copy" id="copyBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span id="copyText">Copiar número</span>
      </button>

      <div class="label" style="margin-top: 22px;">Titular</div>
      <div class="holder" style="margin-top: 0;">ANA PAOLA SANCHEZ GUAJARDO</div>

      <div class="note">
        <strong>Mandar tu comprobante</strong> por WhatsApp después de transferir.
      </div>

      <a class="btn btn-whatsapp" id="waBtn" target="_blank" rel="noopener"
         href="https://wa.me/528442734657?text=Hola%2C%20te%20env%C3%ADo%20mi%20comprobante%20de%20pago">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.47 14.38c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.17-.17.2-.35.22-.64.07-.3-.15-1.26-.46-2.4-1.48-.89-.79-1.49-1.77-1.66-2.07-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.07-.15-.67-1.62-.92-2.22-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48s1.07 2.88 1.21 3.08c.15.2 2.1 3.2 5.08 4.49.71.31 1.26.49 1.69.63.71.23 1.36.2 1.87.12.57-.09 1.76-.72 2.01-1.41.25-.7.25-1.29.17-1.41-.07-.12-.27-.2-.57-.35zM12.04 21.5h-.01a9.45 9.45 0 0 1-4.82-1.32l-.35-.21-3.58.94.96-3.49-.23-.36A9.43 9.43 0 0 1 2.56 12c0-5.23 4.26-9.48 9.49-9.48 2.53 0 4.91.99 6.7 2.78a9.42 9.42 0 0 1 2.78 6.71c0 5.23-4.26 9.49-9.49 9.49zm8.07-17.56A11.33 11.33 0 0 0 12.04.6C5.75.6.63 5.72.63 12c0 2.01.52 3.97 1.52 5.7L.54 23.4l5.84-1.53a11.4 11.4 0 0 0 5.66 1.44h.01c6.29 0 11.41-5.12 11.41-11.4 0-3.05-1.19-5.91-3.35-8.07z"/></svg>
        Enviar comprobante por WhatsApp
      </a>
      <div class="phone">WhatsApp: 844-273-4657</div>
    </section>

    <footer>Gracias por tu compra 🧡</footer>
  </main>

  <script>
    const ACCOUNT = "5579070168909375";
    const copyBtn = document.getElementById("copyBtn");
    const copyText = document.getElementById("copyText");

    function fallbackCopy(text) {
      const input = document.createElement("textarea");
      input.value = text;
      input.setAttribute("readonly", "");
      input.style.position = "fixed";
      input.style.opacity = "0";
      document.body.appendChild(input);
      input.select();
      document.execCommand("copy");
      document.body.removeChild(input);
    }

    copyBtn.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(ACCOUNT);
      } catch (e) {
        fallbackCopy(ACCOUNT);
      }
      copyBtn.classList.add("copied");
      copyText.textContent = "¡Copiado!";
      setTimeout(() => {
        copyBtn.classList.remove("copied");
        copyText.textContent = "Copiar número";
      }, 2000);
    });
  </script>
</body>
</html>
